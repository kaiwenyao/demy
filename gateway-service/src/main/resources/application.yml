server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/