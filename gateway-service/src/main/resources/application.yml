server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: enrollment-route
              uri: lb://enrollment-service
              predicates:
                - Path=/api/v1/enrollments/**
            - id: course-route
              uri: lb://course-service
              predicates:
                - Path=/api/v1/courses/**
            - id: order-route
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  # 必须和 auth-service 完全一致
  secret: c2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctYXQtbGVhc3QtMzJieXRlcw==
